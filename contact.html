<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nasarino Colon | Contact</title>
    <link rel="stylesheet" href="style.css">
</head><body><header>
    <h1>Contact Me</h1>
    <p>Get in touch with me</p>
</header><nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Me</a>
    <a href="projects.html">Projects</a>
    <a href="contact.html">Contact</a>
</nav><main><section class="contact-box">

    <h2>Contact Information</h2>

    <p>
        <strong>Name:</strong> Nasarino Colon
    </p>

    <p>
        <strong>Email:</strong> nasarino@gmail.com
    </p>

    <h2>Send Me a Message</h2>

    <form>

        <label for="name">Full Name:</label>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
        >

        <label for="email">Email:</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
        >

        <p>How did you find my portfolio?</p>

        <label>
            <input type="radio" name="source" value="friend">
            Friend
        </label>

        <label>
            <input type="radio" name="source" value="school">
            School
        </label>

        <label>
            <input type="radio" name="source" value="other">
            Other
        </label>

        <p>What are you interested in?</p>

        <label>
            <input type="checkbox" name="interest" value="html">
            HTML
        </label>

        <label>
            <input type="checkbox" name="interest" value="css">
            CSS
        </label>

        <label>
            <input type="checkbox" name="interest" value="web">
            Web Design
        </label>

        <label for="topic">Message Topic:</label>

        <select id="topic" name="topic">
            <option value="question">Question</option>
            <option value="feedback">Feedback</option>
            <option value="project">Project</option>
            <option value="other">Other</option>
        </select>

        <label for="message">Message:</label>

        <textarea
            id="message"
            name="message"
            rows="5"
            placeholder="Write your message here"
        ></textarea>

        <div class="form-buttons">
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </div>

    </form>

</section>

</main><footer>
    <p>&copy; 2026 Nasarino Colon</p>
</footer></body>
</html>
